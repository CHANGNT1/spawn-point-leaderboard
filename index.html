<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spawn Point | Live Booth Leaderboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .glass-panel { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glow-gold { box-shadow: 0 0 25px rgba(234, 179, 8, 0.3); }
        .glow-silver { box-shadow: 0 0 20px rgba(156, 163, 175, 0.3); }
        .glow-bronze { box-shadow: 0 0 20px rgba(217, 119, 6, 0.3); }
        .glow-cyan { box-shadow: 0 0 25px rgba(6, 182, 212, 0.25); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(14,165,233,0.15),rgba(255,255,255,0))]">

    <!-- Top Navigation Bar -->
    <header class="border-b border-slate-800 bg-slate-900/60 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center glow-cyan">
                    <i class="fa-solid fa-gamepad text-xl text-white"></i>
                </div>
                <div>
                    <span class="text-xs uppercase tracking-widest text-cyan-400 font-extrabold block">Booth Live Scoreboard</span>
                    <h1 class="text-2xl font-black tracking-tight text-white">SPAWN POINT</h1>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openModal()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-4 py-2.5 rounded-xl transition-all shadow-lg shadow-cyan-500/20 flex items-center space-x-2 text-sm cursor-pointer">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add Score</span>
                </button>
                <button onclick="exportCSV()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold px-4 py-2.5 rounded-xl transition-all border border-slate-700 flex items-center space-x-2 text-sm cursor-pointer" title="Export Leaderboard as CSV">
                    <i class="fa-solid fa-download"></i>
                    <span class="hidden sm:inline">Export CSV</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main App Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Game Category Tabs -->
        <div id="gameTabs" class="flex flex-wrap gap-2 mb-8 border-b border-slate-800 pb-4">
            <button onclick="switchTab('All')" class="tab-btn px-5 py-2.5 rounded-xl font-bold text-sm transition-all bg-cyan-500 text-slate-950 shadow-lg shadow-cyan-500/20 cursor-pointer">
                <i class="fa-solid fa-trophy mr-2"></i> All Games
            </button>
            <button onclick="switchTab('FIFA')" class="tab-btn px-5 py-2.5 rounded-xl font-bold text-sm transition-all bg-slate-900 text-slate-400 hover:bg-slate-800 hover:text-white border border-slate-800 cursor-pointer">
                <i class="fa-solid fa-futbol mr-2"></i> FIFA
            </button>
            <button onclick="switchTab('Rocket League')" class="tab-btn px-5 py-2.5 rounded-xl font-bold text-sm transition-all bg-slate-900 text-slate-400 hover:bg-slate-800 hover:text-white border border-slate-800 cursor-pointer">
                <i class="fa-solid fa-car-side mr-2"></i> Rocket League
            </button>
        </div>

        <!-- Search and Filter Row -->
        <div class="flex flex-col sm:flex-row gap-4 mb-8 justify-between items-center">
            <div class="relative w-full sm:w-80">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchInput" oninput="renderApp()" placeholder="Search player name..." class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition-colors">
            </div>
            <div class="text-sm text-slate-400 flex items-center space-x-2">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Live Booth Display &bull; Click any player to celebrate!</span>
            </div>
        </div>

        <!-- Top 3 Podium Section -->
        <section id="podiumSection" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
            <!-- Dynamically populated -->
        </section>

        <!-- Leaderboard Table Section -->
        <section class="glass-panel rounded-2xl overflow-hidden shadow-2xl">
            <div class="px-6 py-5 border-b border-slate-800 flex justify-between items-center bg-slate-900/40">
                <h3 class="font-bold text-lg text-white flex items-center space-x-2">
                    <i class="fa-solid fa-list-ol text-cyan-400"></i>
                    <span id="tableTitleHeader">Leaderboard Standings</span>
                </h3>
                <span id="playerCountBadge" class="text-xs bg-slate-800 text-slate-300 font-semibold px-3 py-1 rounded-full border border-slate-700">0 Players</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400 text-xs uppercase tracking-wider bg-slate-900/80">
                            <th class="py-4 px-6 font-bold w-20 text-center">Rank</th>
                            <th class="py-4 px-6 font-bold">Player Name</th>
                            <th class="py-4 px-6 font-bold">Game</th>
                            <th class="py-4 px-6 font-bold text-right">Score</th>
                            <th class="py-4 px-6 font-bold text-center w-28">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardTableBody" class="divide-y divide-slate-800/60 text-sm">
                        <!-- Dynamically populated -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Add/Edit Score Modal -->
    <div id="scoreModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm hidden p-4">
        <div class="glass-panel w-full max-w-md rounded-2xl p-6 shadow-2xl border border-slate-700/60 relative animate-in fade-in zoom-in-95 duration-150">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modalTitle" class="text-xl font-bold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-circle-plus text-cyan-400"></i>
                    <span>Add New Score</span>
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-800 transition-colors cursor-pointer">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="scoreForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="editIndex" value="">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Player Name</label>
                    <input type="text" id="playerName" required placeholder="e.g. Alex Morgan" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Game Category</label>
                    <select id="gameCategory" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 transition-colors">
                        <option value="FIFA">FIFA</option>
                        <option value="Rocket League">Rocket League</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Score / Points</label>
                    <input type="number" id="playerScore" required placeholder="e.g. 5" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition-colors">
                </div>
                <div class="pt-4 flex space-x-3">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 rounded-xl transition-all border border-slate-700 text-sm cursor-pointer">Cancel</button>
                    <button type="submit" class="flex-1 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-xl transition-all shadow-lg shadow-cyan-500/20 text-sm cursor-pointer">Save Score</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Initial Sample Scores Data
        let scores = JSON.parse(localStorage.getItem('spawn_point_scores')) || [
            { name: 'Marcus Vance', game: 'FIFA', score: 8 },
            { name: 'Sarah Connor', game: 'FIFA', score: 6 },
            { name: 'Leo Sterling', game: 'Rocket League', score: 1250 },
            { name: 'Chloe Price', game: 'Rocket League', score: 980 },
            { name: 'David Miller', game: 'FIFA', score: 5 },
            { name: 'Elena Fisher', game: 'Rocket League', score: 840 }
        ];

        let currentTab = 'All';

        function saveToStorage() {
            localStorage.setItem('spawn_point_scores', JSON.stringify(scores));
        }

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.textContent.trim().includes(tabName)) {
                    btn.className = 'tab-btn px-5 py-2.5 rounded-xl font-bold text-sm transition-all bg-cyan-500 text-slate-950 shadow-lg shadow-cyan-500/20 cursor-pointer';
                } else {
                    btn.className = 'tab-btn px-5 py-2.5 rounded-xl font-bold text-sm transition-all bg-slate-900 text-slate-400 hover:bg-slate-800 hover:text-white border border-slate-800 cursor-pointer';
                }
            });
            document.getElementById('tableTitleHeader').textContent = tabName === 'All' ? 'All Games Leaderboard' : `${tabName} Leaderboard`;
            renderApp();
        }

        function renderApp() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            // Filter by Tab and Search Query
            let filtered = scores.filter(item => {
                const matchesTab = currentTab === 'All' || item.game === currentTab;
                const matchesSearch = item.name.toLowerCase().includes(searchTerm);
                return matchesTab && matchesSearch;
            });

            // Sort descending by score
            filtered.sort((a, b) => b.score - a.score);

            document.getElementById('playerCountBadge').textContent = `${filtered.length} Player${filtered.length === 1 ? '' : 's'}`;

            renderPodium(filtered);
            renderTable(filtered);
        }

        function renderPodium(data) {
            const container = document.getElementById('podiumSection');
            if (data.length === 0) {
                container.innerHTML = `
                    <div class="col-span-3 text-center py-12 glass-panel rounded-2xl text-slate-500">
                        <i class="fa-solid fa-ghost text-4xl mb-3 text-slate-600"></i>
                        <p class="font-medium">No players found in this category yet.</p>
                    </div>
                `;
                return;
            }

            const top3 = data.slice(0, 3);
            const podiumConfigs = [
                { rank: 1, title: '1st Place', icon: 'fa-crown', color: 'text-amber-400', border: 'border-amber-500/50 glow-gold', bg: 'from-amber-500/10 to-slate-900' },
                { rank: 2, title: '2nd Place', icon: 'fa-medal', color: 'text-slate-300', border: 'border-slate-400/40 glow-silver', bg: 'from-slate-400/10 to-slate-900' },
                { rank: 3, title: '3rd Place', icon: 'fa-award', color: 'text-amber-600', border: 'border-amber-700/40 glow-bronze', bg: 'from-amber-700/10 to-slate-900' }
            ];

            let html = '';
            podiumConfigs.forEach((cfg, idx) => {
                const player = top3[idx];
                if (!player) {
                    html += `
                        <div class="glass-panel rounded-2xl p-6 flex flex-col items-center justify-center text-center opacity-40 border border-slate-800">
                            <span class="text-xs uppercase font-bold text-slate-500 tracking-wider mb-2">${cfg.title}</span>
                            <div class="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center text-slate-600 mb-3 font-black">?</div>
                            <span class="text-slate-500 font-semibold text-sm">Open Slot</span>
                        </div>
                    `;
                } else {
                    html += `
                        <div onclick="celebratePlayer()" class="glass-panel rounded-2xl p-6 flex flex-col items-center text-center relative border ${cfg.border} bg-gradient-to-b ${cfg.bg} transition-transform hover:scale-[1.02] cursor-pointer">
                            <div class="absolute top-4 right-4 ${cfg.color} text-lg"><i class="fa-solid ${cfg.icon}"></i></div>
                            <span class="text-xs uppercase font-black tracking-widest ${cfg.color} mb-3">${cfg.title}</span>
                            <div class="w-16 h-16 rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center text-2xl font-black text-white mb-3 shadow-inner">
                                ${player.name.charAt(0).toUpperCase()}
                            </div>
                            <h4 class="font-bold text-lg text-white mb-1 truncate w-full">${player.name}</h4>
                            <span class="text-xs bg-slate-800 text-slate-300 px-3 py-1 rounded-full mb-3 border border-slate-700">${player.game}</span>
                            <div class="text-3xl font-black text-cyan-400 tracking-tight">${player.score.toLocaleString()}</div>
                        </div>
                    `;
                }
            });
            container.innerHTML = html;
        }

        function renderTable(data) {
            const tbody = document.getElementById('leaderboardTableBody');
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-500 font-medium">No records found.</td></tr>`;
                return;
            }

            let html = '';
            data.forEach((item, index) => {
                let rankBadge = `<span class="font-bold text-slate-400">#${index + 1}</span>`;
                if (index === 0) rankBadge = `<span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-amber-500/20 text-amber-400 font-black border border-amber-500/30">1</span>`;
                else if (index === 1) rankBadge = `<span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-slate-400/20 text-slate-300 font-black border border-slate-400/30">2</span>`;
                else if (index === 2) rankBadge = `<span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-amber-700/20 text-amber-600 font-black border border-amber-700/30">3</span>`;

                // Find original index in full scores array for editing/deleting
                const originalIndex = scores.indexOf(item);

                html += `
                    <tr class="hover:bg-slate-900/50 transition-colors">
                        <td class="py-4 px-6 text-center">${rankBadge}</td>
                        <td class="py-4 px-6 font-bold text-white flex items-center space-x-3">
                            <div class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-xs font-bold text-cyan-400 border border-slate-700">
                                ${item.name.charAt(0).toUpperCase()}
                            </div>
                            <span>${item.name}</span>
                        </td>
                        <td class="py-4 px-6">
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-lg bg-slate-900 text-cyan-300 border border-slate-800">${item.game}</span>
                        </td>
                        <td class="py-4 px-6 text-right font-black text-cyan-400 text-base">${item.score.toLocaleString()}</td>
                        <td class="py-4 px-6 text-center">
                            <div class="flex items-center justify-center space-x-2">
                                <button onclick="editScore(${originalIndex})" class="p-2 text-slate-400 hover:text-cyan-400 transition-colors rounded-lg hover:bg-slate-800 cursor-pointer" title="Edit Score">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                                <button onclick="deleteScore(${originalIndex})" class="p-2 text-slate-400 hover:text-rose-400 transition-colors rounded-lg hover:bg-slate-800 cursor-pointer" title="Delete Score">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function openModal(editIdx = null) {
            document.getElementById('scoreModal').classList.remove('hidden');
            if (editIdx !== null) {
                document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-pen-to-square text-cyan-400"></i><span>Edit Score</span>';
                document.getElementById('editIndex').value = editIdx;
                document.getElementById('playerName').value = scores[editIdx].name;
                document.getElementById('gameCategory').value = scores[editIdx].game;
                document.getElementById('playerScore').value = scores[editIdx].score;
            } else {
                document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-circle-plus text-cyan-400"></i><span>Add New Score</span>';
                document.getElementById('scoreForm').reset();
                document.getElementById('editIndex').value = '';
                if (currentTab !== 'All') {
                    document.getElementById('gameCategory').value = currentTab;
                }
            }
        }

        function closeModal() {
            document.getElementById('scoreModal').classList.add('hidden');
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const editIdx = document.getElementById('editIndex').value;
            const name = document.getElementById('playerName').value.trim();
            const game = document.getElementById('gameCategory').value;
            const score = parseInt(document.getElementById('playerScore').value);

            if (editIdx === '') {
                scores.push({ name, game, score });
                celebratePlayer();
            } else {
                scores[editIdx] = { name, game, score };
            }

            saveToStorage();
            closeModal();
            renderApp();
        }

        function editScore(index) {
            openModal(index);
        }

        function deleteScore(index) {
            if (confirm('Are you sure you want to delete this score?')) {
                scores.splice(index, 1);
                saveToStorage();
                renderApp();
            }
        }

        function celebratePlayer() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        function exportCSV() {
            if (scores.length === 0) {
                alert('No data available to export.');
                return;
            }
            let csvContent = "data:text/csv;charset=utf-8,Player Name,Game,Score\r\n";
            scores.forEach(row => {
                csvContent += `\"${row.name}\",\"${row.game}\",${row.score}\r\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "spawn_point_leaderboard.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Initial render on page load
        renderApp();
    // Paste your SheetBest API URL here
const API_URL = "https://api.sheetbest.com/sheets/eae081db-11a0-4f57-acab-87ec12db7d8d";

let scores = [];
let currentTab = 'All';

// Fetch live scores from Google Sheets
async function fetchScores() {
    try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        // Convert string scores to numbers
        scores = data.map(item => ({
            name: item.name || '',
            game: item.game || 'FIFA',
            score: parseInt(item.score) || 0
        }));

        renderApp();
    } catch (error) {
        console.error('Error fetching scores from Google Sheets:', error);
    }
}

// Send a new score to Google Sheets
async function handleFormSubmit(e) {
    e.preventDefault();
    const name = document.getElementById('playerName').value.trim();
    const game = document.getElementById('gameCategory').value;
    const score = parseInt(document.getElementById('playerScore').value);

    // Save optimistically local first
    scores.push({ name, game, score });
    celebratePlayer();
    closeModal();
    renderApp();

    // Post to Google Sheets API
    try {
        await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ name, game, score })
        });
        // Re-fetch to ensure sync
        fetchScores();
    } catch (error) {
        console.error('Error saving score to Google Sheets:', error);
    }
}

// Auto-refresh data every 10 seconds for the live projected display
setInterval(fetchScores, 10000);

// Initial Load
fetchScores();
</body>
</html>
